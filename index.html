<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <script>
      (() => {
        const pathname = location.pathname
        const lastSegment = pathname.split('/').pop() ?? ''
        const hasFileExtension = /\.[^/.]+$/.test(lastSegment)

        if (pathname !== '/' && !pathname.endsWith('/') && !hasFileExtension) {
          const baseHref = `${location.origin}${pathname}/`.replace(/"/g, '&quot;')
          document.write(`<base href="${baseHref}">`)
        }
      })()
    </script>
    <script>
      (() => {
        const badge = document.createElement('div')
        badge.id = 'index-html-debug-badge'
        badge.textContent = `index.html loaded · ${new Date().toISOString()}`
        badge.style.cssText = [
          'position:fixed',
          'z-index:2147483647',
          'right:8px',
          'bottom:8px',
          'max-width:min(420px,calc(100vw - 16px))',
          'padding:6px 8px',
          'border-radius:4px',
          'background:rgba(0,0,0,.78)',
          'color:#fff',
          'font:12px/1.4 monospace',
          'pointer-events:none',
        ].join(';')

        const mountBadge = () => {
          if (document.body === null) {
            window.setTimeout(mountBadge, 0)
            return
          }

          document.body.appendChild(badge)
        }

        window.__INDEX_HTML_DEBUG__ = {
          baseURI: document.baseURI,
          href: location.href,
          pathname: location.pathname,
        }
        mountBadge()

        const script = document.createElement('script')
        script.src = 'https://cdn.jsdelivr.net/npm/vconsole@3.15.1/dist/vconsole.min.js'
        script.onload = () => {
          if (typeof window.VConsole === 'function') {
            window.__INDEX_HTML_VCONSOLE__ = new window.VConsole()
            badge.textContent = `index.html loaded + vConsole · ${new Date().toISOString()}`
            console.log('[index-html-debug]', window.__INDEX_HTML_DEBUG__)
          } else {
            badge.textContent = 'index.html loaded · vConsole missing'
          }
        }
        script.onerror = () => {
          badge.textContent = 'index.html loaded · vConsole load failed'
        }
        document.head.appendChild(script)
      })()
    </script>
    <link rel="icon" type="image/webp" href="%BASE_URL%device-icons/item_log_belt_01.webp" />
    <title>终末地工业系统仿真器</title>
  </head>
  <body>
    <div id="root"></div>
    <script src="%BASE_URL%version.js"></script>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      const hostname = location.hostname
      const analyticsDisabled = hostname === 'coder-page.hsyhhssyy.net' || hostname.endsWith('.coder-page.hsyhhssyy.net')

      if (!analyticsDisabled) {
        const script = document.createElement('script')
        script.defer = true
        script.src = 'https://static.cloudflareinsights.com/beacon.min.js'
        script.setAttribute('data-cf-beacon', '{"token":"19c349feefc344acab603c33ddee4b39"}')
        document.head.appendChild(script)
      }
    </script>
  </body>
</html>
