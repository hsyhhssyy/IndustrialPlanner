apiVersion: apps/v1
kind: Deployment
metadata:
  name: industrial-planner
  labels:
    app: industrial-planner
spec:
  replicas: 2
  selector:
    matchLabels:
      app: industrial-planner
  template:
    metadata:
      labels:
        app: industrial-planner
    spec:
      # AI-REMOVED 2026-10-09:
      # Reason: 非 Alpha 镜像改为公开 GHCR 包，不再引用私有拉取 Secret。
      # Trigger: 用户要求全部渠道迁移，普通渠道公开。
      # Evidence: release workflow 在部署前验证包为 public 且可匿名读取镜像。
      # Replacement: None
      # Risk: 首次包未公开时部署会在前置验证阶段失败。
      # Human Review: Required
      #
      # Original code:
      #       imagePullSecrets:
      #         - name: ${IMAGE_PULL_SECRET}
      containers:
        - name: industrial-planner
          image: ${IMAGE}
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: industrial-planner
spec:
  selector:
    app: industrial-planner
  ports:
    - port: 80
      targetPort: 80
---
# Ingress 示例（按你的 Ingress Controller 调整）
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: industrial-planner
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - ${DOMAIN}
      secretName: industrial-planner-tls
  rules:
    - host: ${DOMAIN}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: industrial-planner
                port:
                  number: 80
