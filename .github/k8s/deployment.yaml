apiVersion: apps/v1
kind: Deployment
metadata:
  name: industrial-planner
  labels:
    app: industrial-planner
spec:
  replicas: 2
  selector:
    matchLabels:
      app: industrial-planner
  template:
    metadata:
      labels:
        app: industrial-planner
    spec:
      imagePullSecrets:
        - name: docker.hsyhhssyy.net
      containers:
        - name: industrial-planner
          image: ${IMAGE}
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: industrial-planner
spec:
  selector:
    app: industrial-planner
  ports:
    - port: 80
      targetPort: 80
---
# Ingress 示例（按你的 Ingress Controller 调整）
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: industrial-planner
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - ${DOMAIN}
      secretName: industrial-planner-tls
  rules:
    - host: ${DOMAIN}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: industrial-planner
                port:
                  number: 80
