name: Formal Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write
  actions: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate changelog from commits since last tag
        id: changelog
        run: |
          prev_tag=$(git tag --sort=-creatordate | grep -v '${{ github.ref_name }}' | head -1)
          if [ -n "$prev_tag" ]; then
            range="${prev_tag}..HEAD"
          else
            range="HEAD"
          fi

          body=$(git log "$range" --pretty=format:'- %s (%h)' --no-merges | head -50)
          if [ -z "$body" ]; then
            body="Release ${{ github.ref_name }}"
          fi

          echo "$body" > /tmp/changelog.md
          echo "changelog_file=/tmp/changelog.md" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        id: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: ${{ steps.changelog.outputs.changelog_file }}
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Output tag
        id: output-tag
        run: echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT

  docker-build:
    needs: create-release
    uses: ./.github/workflows/docker-build-push.yml
    with:
      tag: ${{ github.ref_name }}
    secrets:
      DEPLOY_CONFIG: ${{ secrets.DEPLOY_CONFIG }}

  k8s-deploy:
    needs: docker-build
    uses: ./.github/workflows/deploy-v3-dev.yml
    with:
      image: ${{ needs.docker-build.outputs.image }}
    secrets:
      DEPLOY_CONFIG: ${{ secrets.DEPLOY_CONFIG }}
      KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}

  release-pages:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - name: Trigger release-pages workflow
        run: |
          gh workflow run release-pages.yml \
            -f tag_name='${{ github.ref_name }}'
        env:
          GH_TOKEN: ${{ github.token }}
