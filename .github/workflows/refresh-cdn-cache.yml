name: Refresh CDN cache
run-name: Refresh endfield.amiyabot.com CDN cache

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: refresh-cdn-endfield-amiyabot-com
  cancel-in-progress: false

jobs:
  refresh-cdn:
    name: Refresh endfield.amiyabot.com cache
    runs-on: ubuntu-latest
    timeout-minutes: 3
    environment:
      name: github-pages
    env:
      CDN_REFRESH_URL: https://cdn.amiyabot.com/api/v1/tencent/teo/cache/endfield.amiyabot.com?self=endfield.amiyabot.com
      CDN_REFRESH_TOKEN: ${{ secrets.CDN_REFRESH_TOKEN }}
    steps:
      - name: Refresh CDN cache
        shell: bash
        run: |
          set -uo pipefail

          : "${CDN_REFRESH_TOKEN:?CDN_REFRESH_TOKEN is required in the github-pages environment}"

          headers_file="$RUNNER_TEMP/cdn-refresh-headers"
          body_file="$RUNNER_TEMP/cdn-refresh-body"

          set +e
          http_status="$(curl --silent --show-error --max-time 75 \
            --request PUT \
            --header "Authorization: Bearer ${CDN_REFRESH_TOKEN}" \
            --dump-header "$headers_file" \
            --output "$body_file" \
            --write-out '%{http_code}' \
            "$CDN_REFRESH_URL")"
          curl_exit_code=$?
          set -e

          printf 'curl exit code: %s\n' "$curl_exit_code"
          printf 'HTTP status: %s\n' "${http_status:-000}"

          if [[ -s "$headers_file" ]]; then
            awk '{
              normalized = tolower($0)
              if (normalized ~ /^http\// ||
                  normalized ~ /^server:/ ||
                  normalized ~ /^eo-log-uuid:/ ||
                  normalized ~ /^cf-ray:/ ||
                  normalized ~ /^content-type:/) {
                print
              }
            }' "$headers_file"
          fi

          if [[ -s "$body_file" ]]; then
            printf 'Response body (JSON-escaped, first 4 KiB):\n'
            head -c 4096 "$body_file" | jq -Rs .
          fi

          if [[ "$curl_exit_code" -ne 0 ]]; then
            exit "$curl_exit_code"
          fi

          if [[ ! "${http_status:-}" =~ ^2[0-9]{2}$ ]]; then
            echo "CDN refresh failed with HTTP ${http_status:-000}" >&2
            exit 1
          fi

          echo 'CDN refresh request succeeded.'
