name: Release
run-name: Release ${{ inputs.tag_name || github.ref_name }}

# beta: Docker + K8s；pre: GitHub prerelease + dist zip；stable/Patch: 全量发布。
# AI-CORRECTION 2026-08-15: 发布阶梯现为 pre: Docker + K8s；beta: Docker + K8s → EdgeOne；stable/Patch: Docker + K8s → EdgeOne → GitHub Pages。GitHub Release 和 dist zip 仅由 stable/Patch 创建。
# AI-CORRECTION 2026-08-15: 上述箭头仅表示发布等级覆盖范围；同一 tag 面向所有允许环境的部署在 dist 构建完成后并行执行。
# AI-CORRECTION 2026-08-29: alpha: 私有 Docker 镜像 + 单实例 K8s Alpha；pre/beta/stable 规则保持不变。Alpha 只在完整 commit SHA 路径暴露当前构建。

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-alpha[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+.[0-9]+-alpha[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-beta[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+.[0-9]+-beta[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-pre[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+.[0-9]+-pre[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+.[0-9]+-Patch[0-9]+'
  workflow_dispatch:
    inputs:
      tag_name:
        description: '要重新发布的 tag，例如 v1.4.0.3-alpha1、v1.4.0.3-beta1、v1.4.0.3-pre1 或 v1.4.0.2'
        required: true
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: release-${{ inputs.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare ${{ inputs.tag_name || github.ref_name }}
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag_name || github.ref_name }}
    outputs:
      tag: ${{ steps.classify.outputs.tag }}
      channel: ${{ steps.classify.outputs.channel }}
      backend_api_base_url: ${{ steps.classify.outputs.backend_api_base_url }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Classify and validate tag
        id: classify
        env:
          DEPLOY_CONFIG: ${{ secrets.DEPLOY_CONFIG }}
        shell: bash
        run: |
          set -euo pipefail

          alpha_pattern='^v[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?-alpha[0-9]+$'
          beta_pattern='^v[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?-beta[0-9]+$'
          pre_pattern='^v[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?-pre[0-9]+$'
          stable_pattern='^v[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$'
          patch_pattern='^v[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+-Patch[0-9]+$'

          if [[ "$RELEASE_TAG" =~ $alpha_pattern ]]; then
            channel='alpha'
          elif [[ "$RELEASE_TAG" =~ $beta_pattern ]]; then
            channel='beta'
          elif [[ "$RELEASE_TAG" =~ $pre_pattern ]]; then
            channel='pre'
          elif [[ "$RELEASE_TAG" =~ $stable_pattern || "$RELEASE_TAG" =~ $patch_pattern ]]; then
            channel='stable'
          else
            echo "Unsupported release tag: $RELEASE_TAG" >&2
            echo 'Expected vX.Y.Z[.N], vX.Y.Z[.N]-alphaN, vX.Y.Z[.N]-betaN, vX.Y.Z[.N]-preN, or vX.Y.Z.N-PatchN.' >&2
            exit 1
          fi

          # AI-REMOVED 2026-08-29:
          # Reason: 发布渠道对应的后端默认 URL 已收敛到 DEPLOY_CONFIG，workflow 不再持有环境地址真相。
          # Trigger: 用户要求每个后端环境可配置默认 URL，stable/patch 选 live，其他发布渠道选 beta。
          # Evidence: VITE_BACKEND_API_BASE_URL 已由 prepare job 统一输出，现有硬编码只需替换其值来源。
          # Replacement: 下方 backend_api_base_urls.beta/live 解析与渠道选择。
          # Risk: DEPLOY_CONFIG 缺少任一默认 URL 时所有发布渠道都会 fail-fast。
          # Human Review: Required
          #
          # Original code:
          # if [ "$channel" = 'stable' ]; then
          #   backend_api_base_url='https://endfield-api.anonymous-test.top'
          # else
          #   backend_api_base_url='https://endfield-api.richetriotour.net'
          # fi

          config_file="$RUNNER_TEMP/deploy-config.json"
          printf '%s' "$DEPLOY_CONFIG" > "$config_file"
          jq -e '
            .backend_api_base_urls as $urls
            | [$urls.beta, $urls.live]
            | all(type == "string" and length > 0)
          ' "$config_file" > /dev/null

          backend_environment='beta'
          if [ "$channel" = 'stable' ]; then
            backend_environment='live'
          fi

          backend_api_base_url="$(
            jq -r --arg environment "$backend_environment" \
              '.backend_api_base_urls[$environment]' "$config_file"
          )"
          if [[ ! "$backend_api_base_url" =~ ^https://[^[:space:]]+$ ]]; then
            echo "DEPLOY_CONFIG.backend_api_base_urls.$backend_environment must be a valid HTTPS URL." >&2
            exit 1
          fi
          while [[ "$backend_api_base_url" == */ ]]; do
            backend_api_base_url="${backend_api_base_url%/}"
          done

          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "backend_api_base_url=$backend_api_base_url" >> "$GITHUB_OUTPUT"
          echo "Release channel: $channel"
          echo "Backend environment: $backend_environment"

      - name: Generate changelog
        if: steps.classify.outputs.channel == 'stable'
        id: changelog
        shell: bash
        run: |
          set -euo pipefail

          previous_tag="$(git describe --tags --abbrev=0 "${RELEASE_TAG}^" 2>/dev/null || true)"

          if [ -n "$previous_tag" ]; then
            range="${previous_tag}..HEAD"
          else
            range='HEAD'
          fi

          body="$(git log "$range" --pretty=format:'- %s (%h)' --no-merges --max-count=50)"
          if [ -z "$body" ]; then
            body="Release $RELEASE_TAG"
          fi

          changelog_file="$RUNNER_TEMP/changelog.md"
          printf '%s\n' "$body" > "$changelog_file"
          echo "changelog_file=$changelog_file" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub Release
        if: steps.classify.outputs.channel == 'stable'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.classify.outputs.tag }}
          name: ${{ steps.classify.outputs.tag }}
          body_path: ${{ steps.changelog.outputs.changelog_file }}
          prerelease: ${{ steps.classify.outputs.channel == 'pre' }}

  build-dist:
    name: Build ${{ needs.prepare.outputs.tag }}
    needs: prepare
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_CHANNEL: ${{ needs.prepare.outputs.channel }}
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Record source SHA
        id: source
        shell: bash
        run: |
          source_sha="$(git rev-parse HEAD)"
          public_base_path='./'
          if [ "$RELEASE_CHANNEL" = 'alpha' ]; then
            public_base_path="/${source_sha}/"
          fi
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "public_base_path=$public_base_path" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Write version tag
        run: printf "window.__APP_VERSION__ = '%s';\n" "$RELEASE_TAG" > public/version.js

      - name: Build application
        env:
          VITE_APP_VERSION: ${{ env.RELEASE_TAG }}
          VITE_BACKEND_API_BASE_URL: ${{ needs.prepare.outputs.backend_api_base_url }}
          VITE_PUBLIC_BASE_PATH: ${{ steps.source.outputs.public_base_path }}
        run: npm run build

      # AI-REMOVED 2026-08-19:
      # Reason: 当前版本产物不再需要为合并旧版而暂存。
      # Trigger: 用户要求 workflow 从下个版本开始不再编译旧版。
      # Evidence: 后续 V2 checkout、build 与 dist/v2 合并步骤同步退出。
      # Replacement: Build application 直接保留 dist 供后续发布任务消费。
      # Risk: Low
      # Human Review: Required
      #
      # Original code:
      # - name: Preserve V3 dist
      #   run: mv dist "$RUNNER_TEMP/v3-dist"

      # AI-REMOVED 2026-08-19:
      # Reason: 发布流程不再拉取、安装或构建 V2 分支。
      # Trigger: 用户要求 workflow 从下个版本开始不再编译旧版。
      # Evidence: V2 仅通过本区块进入统一发布产物，没有其他活动 workflow 调用。
      # Replacement: 当前 release tag 的单次 Build application。
      # Risk: 旧版不再随新发布产物部署。
      # Human Review: Required
      #
      # Original code:
      # - name: Checkout V2 source
      #   uses: actions/checkout@v4
      #   with:
      #     ref: v2
      #     path: .temp/v2-src
      #
      # - name: Install V2 dependencies
      #   working-directory: .temp/v2-src
      #   run: npm ci
      #
      # - name: Build V2
      #   working-directory: .temp/v2-src
      #   run: npm run build

      # AI-REMOVED 2026-08-19:
      # Reason: 发布产物已收敛为当前版本，不再生成 dist/v2。
      # Trigger: 用户要求 workflow 从下个版本开始不再编译旧版。
      # Evidence: Build application 已直接生成后续任务需要的 dist/index.html。
      # Replacement: 下方 Verify dist 仅验证当前版本入口。
      # Risk: Low
      # Human Review: Required
      #
      # Original code:
      # - name: Merge V2 and V3 dist
      #   run: |
      #     mv "$RUNNER_TEMP/v3-dist" dist
      #     mv .temp/v2-src/dist dist/v2
      #     test -f dist/index.html
      #     test -f dist/v2/index.html

      - name: Verify dist
        run: test -f dist/index.html

      - name: Copy EdgeOne Makers config
        run: cp edgeone.json dist/

      - name: Package release asset
        if: env.RELEASE_CHANNEL == 'stable'
        shell: bash
        run: |
          set -euo pipefail
          zip_name="IndustrialPlanner-${RELEASE_TAG}-dist.zip"
          (cd dist && zip -qr "$RUNNER_TEMP/$zip_name" .)
          echo "zip_path=$RUNNER_TEMP/$zip_name" >> "$GITHUB_ENV"

      - name: Upload release asset
        if: env.RELEASE_CHANNEL == 'stable'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" "$zip_path" --clobber

      - name: Write Pages deployment metadata
        if: env.RELEASE_CHANNEL == 'stable'
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          printf '{"releaseTag":"%s","sha":"%s","runId":"%s"}\n' \
            "$RELEASE_TAG" "$SOURCE_SHA" "$GITHUB_RUN_ID" > dist/release.json

      - name: Upload Pages artifact
        if: env.RELEASE_CHANNEL == 'stable'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Upload dist for Docker
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: ./dist
          retention-days: 1

  deploy-edgeone:
    name: EdgeOne Makers ${{ needs.prepare.outputs.tag }}
    if: needs.prepare.outputs.channel == 'beta' || needs.prepare.outputs.channel == 'stable'
    needs:
      - prepare
      # AI-REMOVED 2026-08-15:
      # Reason: EdgeOne 与 Docker/K8s 是同一发布等级内的独立目标，不能被串行化。
      # Trigger: 用户要求保持单个 tag 的多个目标并行发布。
      # Evidence: 发布等级仅定义覆盖范围，Docker、EdgeOne、GitHub Pages 是独立环境。
      # Replacement: build-dist；EdgeOne 在 dist 构建完成后与 Docker/K8s 并行执行。
      # Risk: Low
      # Human Review: Required
      #
      # Original code:
      # - deploy-container
      - build-dist
    runs-on: ubuntu-latest
    steps:
      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: ./dist

      - name: Deploy to EdgeOne Makers
        env:
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
        run: |
          npm install -g edgeone
          edgeone makers deploy ./dist -n endfield-planner -t "$EDGEONE_API_TOKEN"

  build-docker:
    name: Docker ${{ needs.prepare.outputs.tag }}
    if: needs.prepare.outputs.channel == 'alpha' || needs.prepare.outputs.channel == 'pre' || needs.prepare.outputs.channel == 'beta' || needs.prepare.outputs.channel == 'stable'
    needs:
      - prepare
      - build-dist
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_CHANNEL: ${{ needs.prepare.outputs.channel }}
    outputs:
      image: ${{ steps.container.outputs.image }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: ./dist

      - name: Load container publish config
        id: container
        env:
          DEPLOY_CONFIG: ${{ secrets.DEPLOY_CONFIG }}
        shell: bash
        run: |
          set -euo pipefail

          config_file="$RUNNER_TEMP/deploy-config.json"
          printf '%s' "$DEPLOY_CONFIG" > "$config_file"
          image_name_key='image_name'
          if [ "$RELEASE_CHANNEL" = 'alpha' ]; then
            image_name_key='alpha_image_name'
          fi

          jq -e --arg image_name_key "$image_name_key" '
            [.registry, .username, .password, .[$image_name_key]]
            | all(type == "string" and length > 0)
          ' "$config_file" > /dev/null

          registry="$(jq -r '.registry' "$config_file")"
          username="$(jq -r '.username' "$config_file")"
          password="$(jq -r '.password' "$config_file")"
          image_name="$(jq -r --arg image_name_key "$image_name_key" '.[$image_name_key]' "$config_file")"
          image="${registry}/${image_name}:${RELEASE_TAG}"

          echo "::add-mask::$password"
          echo "registry=$registry" >> "$GITHUB_OUTPUT"
          echo "username=$username" >> "$GITHUB_OUTPUT"
          echo "password=$password" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          {
            echo 'tags<<EOF'
            echo "$image"
            if [ "$RELEASE_CHANNEL" = 'stable' ]; then
              echo "${registry}/${image_name}:latest"
            fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.container.outputs.registry }}
          username: ${{ steps.container.outputs.username }}
          password: ${{ steps.container.outputs.password }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./dist
          file: .github/Dockerfile
          push: true
          tags: ${{ steps.container.outputs.tags }}

  deploy-container:
    name: Deploy container
    if: needs.prepare.outputs.channel == 'pre' || needs.prepare.outputs.channel == 'beta' || needs.prepare.outputs.channel == 'stable'
    needs:
      - prepare
      - build-docker
    runs-on: ubuntu-latest
    env:
      IMAGE: ${{ needs.build-docker.outputs.image }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Load K8s deploy config
        env:
          DEPLOY_CONFIG: ${{ secrets.DEPLOY_CONFIG }}
        shell: bash
        run: |
          set -euo pipefail

          config_file="$RUNNER_TEMP/deploy-config.json"
          printf '%s' "$DEPLOY_CONFIG" > "$config_file"
          jq -e '
            [.domain, .namespace]
            | all(type == "string" and length > 0)
          ' "$config_file" > /dev/null

          echo "domain=$(jq -r '.domain' "$config_file")" >> "$GITHUB_ENV"
          echo "namespace=$(jq -r '.namespace' "$config_file")" >> "$GITHUB_ENV"

          # image_pull_secret: 未配置时回退到 registry 名
          image_pull_secret="$(jq -r '.image_pull_secret // empty' "$config_file")"
          if [ -z "$image_pull_secret" ]; then
            image_pull_secret="$(jq -r '.registry' "$config_file")"
          fi
          echo "image_pull_secret=$image_pull_secret" >> "$GITHUB_ENV"

      - name: Render and apply K8s manifests
        env:
          DOMAIN: ${{ env.domain }}
          NAMESPACE: ${{ env.namespace }}
          IMAGE_PULL_SECRET: ${{ env.image_pull_secret }}
          KUBECONFIG_DATA: ${{ secrets.KUBE_CONFIG }}
        shell: bash
        run: |
          set -euo pipefail

          kubeconfig_file="$RUNNER_TEMP/kubeconfig"
          printf '%s' "$KUBECONFIG_DATA" > "$kubeconfig_file"
          chmod 600 "$kubeconfig_file"
          export KUBECONFIG="$kubeconfig_file"

          envsubst < .github/k8s/deployment.yaml | kubectl apply -n "$NAMESPACE" -f -
          kubectl rollout status deployment/industrial-planner -n "$NAMESPACE" --timeout=120s

  deploy-alpha-container:
    name: Deploy Alpha container
    if: needs.prepare.outputs.channel == 'alpha'
    needs:
      - prepare
      - build-dist
      - build-docker
    runs-on: ubuntu-latest
    env:
      IMAGE: ${{ needs.build-docker.outputs.image }}
      SOURCE_SHA: ${{ needs.build-dist.outputs.source_sha }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Load Alpha K8s deploy config
        env:
          DEPLOY_CONFIG: ${{ secrets.DEPLOY_CONFIG }}
        shell: bash
        run: |
          set -euo pipefail

          config_file="$RUNNER_TEMP/deploy-config.json"
          printf '%s' "$DEPLOY_CONFIG" > "$config_file"
          jq -e '
            [.alpha_domain, .namespace]
            | all(type == "string" and length > 0)
          ' "$config_file" > /dev/null

          alpha_domain="$(jq -r '.alpha_domain' "$config_file")"
          if [[ ! "$alpha_domain" =~ ^[a-z0-9]([a-z0-9.-]*[a-z0-9])?$ ]]; then
            echo 'DEPLOY_CONFIG.alpha_domain must be a lowercase DNS hostname without scheme or path.' >&2
            exit 1
          fi

          echo "alpha_domain=$alpha_domain" >> "$GITHUB_ENV"
          echo "namespace=$(jq -r '.namespace' "$config_file")" >> "$GITHUB_ENV"

          # image_pull_secret: 未配置时回退到 registry 名
          image_pull_secret="$(jq -r '.image_pull_secret // empty' "$config_file")"
          if [ -z "$image_pull_secret" ]; then
            image_pull_secret="$(jq -r '.registry' "$config_file")"
          fi
          echo "image_pull_secret=$image_pull_secret" >> "$GITHUB_ENV"

      - name: Validate Alpha source identity
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid full commit SHA: $SOURCE_SHA" >&2
            exit 1
          fi

      - name: Render and apply Alpha K8s manifests
        env:
          ALPHA_DOMAIN: ${{ env.alpha_domain }}
          NAMESPACE: ${{ env.namespace }}
          IMAGE_PULL_SECRET: ${{ env.image_pull_secret }}
          KUBECONFIG_DATA: ${{ secrets.KUBE_CONFIG }}
        shell: bash
        run: |
          set -euo pipefail

          kubeconfig_file="$RUNNER_TEMP/kubeconfig"
          printf '%s' "$KUBECONFIG_DATA" > "$kubeconfig_file"
          chmod 600 "$kubeconfig_file"
          export KUBECONFIG="$kubeconfig_file"

          envsubst < .github/k8s/alpha-deployment.yaml | kubectl apply -n "$NAMESPACE" -f -
          kubectl rollout status deployment/industrial-planner-alpha -n "$NAMESPACE" --timeout=120s

          alpha_url="https://${ALPHA_DOMAIN}/${SOURCE_SHA}/"
          echo "Alpha URL: $alpha_url"
          echo "Alpha URL: $alpha_url" >> "$GITHUB_STEP_SUMMARY"

  deploy-pages:
    name: Deploy GitHub Pages
    if: needs.prepare.outputs.channel == 'stable'
    needs:
      - prepare
      - build-dist
      # AI-REMOVED 2026-08-15:
      # Reason: GitHub Pages 与 Docker/K8s、EdgeOne 是同一正式版发布中的独立目标，不能被串行化。
      # Trigger: 用户要求保持单个 tag 的多个目标并行发布。
      # Evidence: 发布等级仅定义覆盖范围，Docker、EdgeOne、GitHub Pages 是独立环境。
      # Replacement: build-dist；GitHub Pages 在 dist 构建完成后与 Docker/K8s、EdgeOne 并行执行。
      # Risk: Low
      # Human Review: Required
      #
      # Original code:
      # - deploy-edgeone
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      CDN_REFRESH_URL: https://cdn.amiyabot.com/api/v1/tencent/teo/cache/endfield.amiyabot.com?self=endfield.amiyabot.com
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Wait for deployed release
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
          SOURCE_SHA: ${{ needs.build-dist.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${SITE_URL:-}" ]; then
            echo 'Deployment page URL is missing' >&2
            exit 1
          fi

          metadata_url="${SITE_URL%/}/release.json"
          expected_sha="\"sha\":\"${SOURCE_SHA}\""

          for attempt in $(seq 1 30); do
            response_file="$(mktemp)"
            status_code="$(curl -L -sS --max-time 20 \
              -H 'Cache-Control: no-cache' \
              -H 'Pragma: no-cache' \
              -o "$response_file" \
              -w '%{http_code}' \
              "$metadata_url")"

            if [ "$status_code" = '200' ] && grep -Fq "$expected_sha" "$response_file"; then
              echo "Detected deployment SHA '$SOURCE_SHA' at $metadata_url"
              rm -f "$response_file"
              exit 0
            fi

            echo "Waiting for deployment SHA '$SOURCE_SHA' at $metadata_url (attempt $attempt/30, status=$status_code)"
            rm -f "$response_file"
            sleep 10
          done

          echo "Timed out waiting for deployment SHA '$SOURCE_SHA' at $metadata_url" >&2
          exit 1

      - name: Refresh CDN cache
        env:
          CDN_REFRESH_TOKEN: ${{ secrets.CDN_REFRESH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CDN_REFRESH_TOKEN:-}" ]; then
            echo 'CDN_REFRESH_TOKEN is not configured' >&2
            exit 1
          fi

          curl -fsS -X PUT "$CDN_REFRESH_URL" \
            -H "Authorization: Bearer $CDN_REFRESH_TOKEN"
