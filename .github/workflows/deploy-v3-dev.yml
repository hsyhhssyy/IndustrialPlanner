name: Deploy V3 Dev

on:
  push:
    branches: [v3]
    paths-ignore:
      - ".docs/**"
      - "*.md"
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Load deploy config
        env:
          DEPLOY_CONFIG: ${{ secrets.DEPLOY_CONFIG }}
        run: |
          echo "$DEPLOY_CONFIG" > /tmp/deploy-config.json
          echo "registry=$(jq -r '.registry' /tmp/deploy-config.json)" >> $GITHUB_ENV
          echo "username=$(jq -r '.username' /tmp/deploy-config.json)" >> $GITHUB_ENV
          echo "password=$(jq -r '.password' /tmp/deploy-config.json)" >> $GITHUB_ENV
          echo "image_name=$(jq -r '.image_name' /tmp/deploy-config.json)" >> $GITHUB_ENV
          echo "domain=$(jq -r '.domain' /tmp/deploy-config.json)" >> $GITHUB_ENV
          echo "namespace=$(jq -r '.namespace' /tmp/deploy-config.json)" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.registry }}
          username: ${{ env.username }}
          password: ${{ env.password }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./dist
          file: .github/Dockerfile
          push: true
          tags: |
            ${{ env.registry }}/${{ env.image_name }}:${{ github.sha }}
            ${{ env.registry }}/${{ env.image_name }}:latest

      - name: Render and apply K8s manifests
        env:
          IMAGE: ${{ env.registry }}/${{ env.image_name }}:${{ github.sha }}
          DOMAIN: ${{ env.domain }}
          NAMESPACE: ${{ env.namespace }}
          KUBECONFIG_DATA: ${{ secrets.KUBE_CONFIG }}
        run: |
          mkdir -p $HOME/.kube
          echo "$KUBECONFIG_DATA" > $HOME/.kube/config
          envsubst < .github/k8s/deployment.yaml | kubectl apply -n "$NAMESPACE" -f -
          kubectl rollout status deployment/industrial-planner -n "$NAMESPACE" --timeout=120s
